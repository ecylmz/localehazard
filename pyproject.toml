[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localehazard"
version = "2.0.0"
description = "Replication utilities for the LocaleHazard study of text roles in locale-sensitive operations"
requires-python = ">=3.11"
authors = [
  {name = "Emre Can Yılmaz", email = "emrecan@omu.edu.tr"},
]

[project.scripts]
localehazard-analyze = "localehazard.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]
